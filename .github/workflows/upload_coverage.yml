name: Coverage

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # apt on the hosted images can block forever on an interactive
  # needrestart/debconf prompt; -y does not suppress those.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Init submodules with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive; then
              echo "Submodule init succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Submodule init failed after 5 attempts"
          exit 1

      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" ninja-build lcov flatbuffers-compiler libflatbuffers-dev

      - name: Build with coverage C++
        run: ./.scripts/linux/build-with-coverage.sh

      - name: Test with coverage C++
        run: ./.scripts/linux/test-with-coverage.sh

      - name: Generate lcov report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --include '*/vowpalwabbit/*' \
            --exclude '*/tests/*' --exclude '*/test/*' --exclude '*/ext_libs/*' \
            --ignore-errors unused
          lcov --summary coverage.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-coverage-report
          path: coverage.info
          retention-days: 7

      - name: Upload to codecov.io
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
