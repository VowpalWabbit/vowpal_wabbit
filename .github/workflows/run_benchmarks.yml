name: Run Benchmarks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # apt on the hosted images can block forever on an interactive
  # needrestart/debconf prompt; -y does not suppress those.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      deployments: write
      # comment-on-alert posts a PR review; without this it fails with
      # "Resource not accessible by integration" instead of reporting the alert.
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Init submodules with retry
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive; then
              echo "Submodule init succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Submodule init failed after 5 attempts"
          exit 1
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Install build dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" ninja-build autoconf automake autoconf-archive
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Clear vcpkg temp files and update
        shell: bash
        run: |
          rm -rf ext_libs/vcpkg/downloads
          rm -rf ext_libs/vcpkg/buildtrees
          git submodule update --init ext_libs/vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/ext_libs/vcpkg'
      - name: Configure
        run: cmake --preset vcpkg-release -DBUILD_BENCHMARKS=On -DUSE_LATEST_STD=ON
      - name: Compile
        run: cmake --build build --target vw-benchmarks.out
      - name: Run benchmarks
        run: >
          ./build/test/benchmarks/vw-benchmarks.out
          --benchmark_min_time=3
          --benchmark_format=json
          --benchmark_out_format=json
          --benchmark_out=benchmark_results.json
      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'googlecpp'
          output-file-path: benchmark_results.json
          alert-threshold: '150%'
          # Report regressions, but do not block merges on them.
          #
          # The comparison is against whatever the last master run stored, and master runs
          # and pull request runs land on different machines from GitHub's standard pool.
          # That pool mixes CPU generations: a master baseline measured at 3500 MHz
          # against a pull request measured at 3219 MHz, on hardware differing in more
          # than clock, moved these benchmarks by 1.5-1.9x with no code change at all.
          #
          # This blocked the 9.11.4 and 9.11.5 release pull requests, neither of which
          # contained a single line of executable code -- only version.txt, CHANGELOG.md
          # and test reference files. Reproducibly, across re-runs. Meanwhile master runs
          # showed no alerts, because those compare master to master.
          #
          # A gate that fires on runner assignment rather than on code is not protecting
          # anything; it just teaches people to bypass it, and it was doing that on
          # security releases. The alert still posts a comment on the pull request, so a
          # real regression remains visible -- it simply no longer stops the merge.
          #
          # Fixing this properly means not comparing across machines: either pinned
          # hardware (larger or self-hosted runners, neither of which this org currently
          # has) or building both the base and head binaries in one run and comparing them
          # on the same machine. The latter is the better answer but roughly doubles a job
          # whose benchmark phase is already 18 of its 25 minutes.
          fail-on-alert: false
          # A fork PR's GITHUB_TOKEN is read-only whatever the permissions block
          # says, so commenting can only ever 403 there.
          comment-on-alert: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          auto-push: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push results to gh-pages branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        run: git push 'https://VowpalWabbit:${{ secrets.GITHUB_TOKEN }}@github.com/VowpalWabbit/vowpal_wabbit.git' gh-pages:gh-pages
