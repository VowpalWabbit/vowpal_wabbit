name: Java Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # apt on the hosted images can block forever on an interactive
  # needrestart/debconf prompt; -y does not suppress those.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

permissions:
  contents: read

jobs:
  build-native:
    name: native.${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,    name: linux_64 }
          - { os: ubuntu-24.04-arm, name: linux_arm64 }
          - { os: macos-14,         name: macos_arm64 }
          - { os: macos-15-intel,   name: macos_x64 }
          - { os: windows-latest,   name: windows_64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.config.os, 'macos')
        run: brew install ninja

      - name: Set up MSVC (Windows)
        if: startsWith(matrix.config.os, 'windows')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAVA=On \
            -DBUILD_TESTING=Off \
            -DVW_FEAT_FLATBUFFERS=Off \
            -DVW_FEAT_CSV=On \
            -DRAPIDJSON_SYS_DEP=Off \
            -DFMT_SYS_DEP=Off \
            -DSPDLOG_SYS_DEP=Off \
            -DVW_ZLIB_SYS_DEP=Off \
            -DVW_BOOST_MATH_SYS_DEP=Off

      - name: Build JNI library
        run: cmake --build build -t vw_jni

      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vw-jni-native-${{ matrix.config.name }}
          path: java/target/bin/natives/
          retention-days: 400

  build-static-test:
    name: static-jni-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" ninja-build flatbuffers-compiler libflatbuffers-dev

      - name: Configure CMake (static linking)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAVA=On \
            -DSTATIC_LINK_VW_JAVA=On \
            -DBUILD_SHARED_LIBS=Off \
            -DBUILD_TESTING=Off \
            -DVW_FEAT_FLATBUFFERS=On \
            -DVW_FEAT_CSV=On \
            -DVW_FEAT_CB_GRAPH_FEEDBACK=On \
            -DWARNINGS=Off \
            -DRAPIDJSON_SYS_DEP=Off \
            -DFMT_SYS_DEP=Off \
            -DSPDLOG_SYS_DEP=Off \
            -DVW_ZLIB_SYS_DEP=Off \
            -DVW_BOOST_MATH_SYS_DEP=Off \
            -DVW_BUILD_LAS_WITH_SIMD=Off
        env:
          LDFLAGS: "-Wl,--exclude-libs,ALL -static-libgcc -static-libstdc++"

      - name: Build JNI library
        run: cmake --build build -t vw_jni

      - name: Run Java tests
        run: mvn clean test integration-test -f java/pom.xml

  assemble:
    name: Assemble multi-platform JAR
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download all native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vw-jni-native-*
          path: java/target/bin/natives/
          merge-multiple: true

      - name: Verify all platforms present
        shell: bash
        run: |
          echo "=== Native libraries ==="
          find java/target/bin/natives/ -type f | sort
          echo ""
          for platform in linux_64 linux_arm64 macos_arm64 macos_x64 windows_64; do
            count=$(find "java/target/bin/natives/$platform" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Missing native library for $platform"
              exit 1
            fi
            echo "OK: $platform ($count files)"
          done

      - name: Generate pom.xml
        shell: bash
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "Version: $VERSION"
          sed -e "s/@PACKAGE_VERSION@/$VERSION/g" \
              -e "s/@VW_JNI_NATIVES_DIR@/linux_64/g" \
              java/pom.xml.in > java/pom.xml

      - name: Build JARs
        working-directory: java
        run: mvn -B package -DskipTests=true

      - name: Verify JAR contents
        shell: bash
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          MAIN_JAR="java/target/vw-jni-${VERSION}.jar"
          echo "=== Natives in JAR ==="
          jar tf "$MAIN_JAR" | grep natives/ | sort
          echo ""
          echo "=== All JARs ==="
          ls -lh java/target/vw-jni-*.jar

      - name: Upload assembled JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vw-jni-jars
          path: |
            java/target/vw-jni-*.jar
            !java/target/vw-jni-*-test*.jar
          retention-days: 400

  # Deploy to Maven Central on a release tag.
  #
  # Unlike the NuGet, npm and PyPI pipelines, this cannot be keyless: Maven Central has no
  # OIDC trusted publishing, so it needs a Portal user token and a GPG signing key stored as
  # secrets. Use a dedicated release-only signing key, so it can be revoked without
  # collateral.
  #
  # This job reuses the assemble job's work rather than rebuilding: the JAR needs native
  # libraries for five platforms, which only CI produces, and that is what made publishing
  # by hand impractical.
  #
  # See java/RELEASE.md for the setup and failure modes.
  publish_maven:
    name: Publish to Maven Central
    needs: [assemble, build-static-test]
    # Tags only. This workflow also runs on workflow_dispatch, which must not publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Check publishing is configured
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=""
          for v in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            [[ -z "${!v}" ]] && missing="$missing $v"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Maven Central publishing is not configured. Missing secrets:$missing"
            echo "See java/RELEASE.md. Until these are set, release tags will not reach Maven Central."
            exit 1
          fi
      # setup-java writes the settings.xml server entry, so the token never has to be
      # interpolated into a shell command. The id must match <publishingServerId> in the pom.
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Download all native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vw-jni-native-*
          path: java/target/bin/natives/
          merge-multiple: true
      - name: Verify all platforms present
        shell: bash
        run: |
          for platform in linux_64 linux_arm64 macos_arm64 macos_x64 windows_64; do
            count=$(find "java/target/bin/natives/$platform" -type f 2>/dev/null | wc -l)
            if [[ "$count" -eq 0 ]]; then
              echo "::error::Missing native library for $platform; refusing to publish a partial JAR."
              exit 1
            fi
            echo "OK: $platform ($count files)"
          done
      - name: Check the tag matches version.txt
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GIT_REF#refs/tags/}"
          version=$(tr -d '[:space:]' < version.txt)
          echo "tag=$tag version.txt=$version"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $tag does not match version.txt ($version)."
            exit 1
          fi
          # A -SNAPSHOT version cannot be released to Central, and silently produces a
          # snapshot deployment rather than a release.
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::version.txt is a SNAPSHOT ($version); Central will not accept it."
            exit 1
          fi
      - name: Generate pom.xml
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          sed -e "s/@PACKAGE_VERSION@/$VERSION/g" \
              -e "s/@VW_JNI_NATIVES_DIR@/linux_64/g" \
              java/pom.xml.in > java/pom.xml
      # performRelease activates the release-sign-artifacts profile, which signs every
      # artifact. Central rejects unsigned deployments.
      #
      # This uploads and validates but does not publish: autoPublish is false in
      # pom.xml.in while the pipeline is still unproven, so the deployment waits in the
      # Portal for a human. See java/RELEASE.md.
      - name: Upload to Maven Central
        working-directory: java
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -DskipTests=true -DperformRelease=true
      # A green job is easy to read as "published". While autoPublish is false it is
      # not, and nothing else in the run says so.
      - name: Say what still has to happen
        shell: bash
        run: |
          if grep -q '<autoPublish>false</autoPublish>' java/pom.xml.in; then
            echo "::notice::Uploaded and validated, NOT published. Press Publish at https://central.sonatype.com/publishing/deployments to make this release live."
          fi
