name: Wasm

on:
  push:
    branches:
      - master
      - 'releases/**'
    # The npm package versions independently of VW itself, so it has its own tags.
    tags:
      - 'wasm_v*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  # apt on the hosted images can block forever on an interactive
  # needrestart/debconf prompt; -y does not suppress those.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Init submodules with retry
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive; then
              echo "Submodule init succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Submodule init failed after 5 attempts"
          exit 1
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Install build dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" ninja-build autoconf automake autoconf-archive
      - name: Clear vcpkg cache and update
        shell: bash
        run: |
          rm -rf ext_libs/vcpkg/downloads
          rm -rf ext_libs/vcpkg/buildtrees
          git submodule update --init ext_libs/vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/ext_libs/vcpkg'
      - uses: mymindstorm/setup-emsdk@29ba4851d6da084ffdc1e0fc390efadbd75df9d1 # v11
      # actions/setup-node only caches when a `cache:` input is given, and none is
      # given here, so this step restores nothing. zizmor's cache-poisoning
      # heuristic fires on the workflow's publishing-shaped trigger rather than on
      # any cache this workflow actually uses.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
            node-version: 20
      - name: Configure
        run: emcmake cmake --preset wasm -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_TOOLCHAIN_FILE=$(pwd)/ext_libs/vcpkg/scripts/buildsystems/vcpkg.cmake -DSPDLOG_FMT_EXTERNAL=OFF -DRAPIDJSON_SYS_DEP=OFF
      - name: Patch spdlog headers to remove SPDLOG_FMT_STRING for Emscripten
        shell: bash
        run: |
          # Remove SPDLOG_FMT_STRING() wrapper from spdlog headers as it causes consteval issues with Emscripten
          # This converts SPDLOG_FMT_STRING("format") to just "format"
          find build/vcpkg_installed/wasm32-emscripten/include/spdlog -type f -name "*.h" -exec sed -i \
            's/SPDLOG_FMT_STRING(\("[^"]*"\))/\1/g' {} +
          echo "Patched spdlog headers to remove SPDLOG_FMT_STRING wrapper"
      - name: Build
        run: cmake --build build --target vw-wasm
      # Uploaded after the emscripten build (so dist/vw-wasm.js is present) and before
      # npm install (so node_modules is not). The publish job consumes this.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-npm-package
          path: wasm
      - name: Test
        working-directory: wasm
        run: |
          npm install
          npm test
      # 0.0.9 was published without its transpiled entry points, so every Node consumer
      # got MODULE_NOT_FOUND (#4921). This packs the tarball exactly as `npm publish`
      # would and fails if anything package.json points at is missing from it.
      - name: Verify package contents
        working-directory: wasm
        run: npm run verify-package

  # Publish @vowpalwabbit/vowpalwabbit to npm when a wasm_v* tag is pushed.
  #
  # Authentication is keyless: npm detects the GitHub OIDC environment and exchanges a
  # short-lived token against the trusted publisher registered for the package. There is no
  # NODE_AUTH_TOKEN and no long-lived npm token to store or rotate. Because the repository
  # and package are both public, npm also generates provenance attestations automatically.
  #
  # See wasm/developer_readme.md for the trusted publisher setup and failure modes.
  publish_npm:
    name: Publish to npm
    needs: job
    # Only the package's own tags. This workflow also runs on master pushes and pull
    # requests, which must never publish.
    if: startsWith(github.ref, 'refs/tags/wasm_v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scoped to this job so no other job in this workflow can mint an OIDC token.
      id-token: write
    steps:
      # The build job's artifact already contains the emscripten output dist/vw-wasm.js,
      # which cannot be rebuilt here without the full emscripten toolchain.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-npm-package
          path: wasm
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22 ships an npm
      # older than that, so npm is upgraded explicitly rather than relying on the bundled
      # version.
      # No `cache:` input is given, so setup-node restores nothing and there is no cache
      # for an attacker to poison. zizmor's heuristic fires on the publishing-shaped
      # trigger, not on any cache this job actually uses -- same as the build job above.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, and Node 22 ships an older npm. Pinned to
      # an exact version rather than a range so the toolchain is reproducible; bump it
      # deliberately. zizmor flags any install outside a lockfile, which cannot apply to
      # the package manager installing itself.
      - name: Use an npm that supports trusted publishing
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install -g npm@11.19.1
          npm --version
          node --version
      - name: Check the tag matches the package version
        working-directory: wasm
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GIT_REF#refs/tags/}"
          tag_version="${tag#wasm_v}"
          pkg_version=$(node -p "require('./package.json').version")
          echo "tag=$tag tag_version=$tag_version package.json=$pkg_version"
          # A mismatch would publish a version nobody tagged, or tag a version nobody
          # published. Both have happened to this project in other ecosystems.
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "::error::Tag $tag implies version $tag_version but package.json says $pkg_version." >&2
            exit 1
          fi
      - name: Install and build
        working-directory: wasm
        # Runs the prepare script, transpiling src/*.ts into dist/. Without this the
        # tarball would contain only the emscripten output -- the 0.0.9 failure (#4921).
        run: npm install
      - name: Verify the tarball has every declared entry point
        working-directory: wasm
        run: npm run verify-package
      - name: Publish
        working-directory: wasm
        # No token: npm picks up the OIDC credentials from the id-token permission above.
        run: npm publish --access public
      - name: Confirm the published package loads
        # Installing the freshly published package from the registry is the point of this
        # step, so it cannot come from a lockfile.
        # zizmor: ignore[adhoc-packages]
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GIT_REF#refs/tags/}"
          version="${tag#wasm_v}"
          # npm's registry is read-through-cached, so allow a moment for the new version.
          sleep 30
          workdir=$(mktemp -d)
          cd "$workdir"
          npm init -y >/dev/null
          # This is the check that would have caught 0.0.9: installing the published
          # tarball and requiring it, rather than trusting that publish succeeded.
          # Installing the freshly published package from the registry is the point of
          # this step, so it cannot come from a lockfile.
          npm install "@vowpalwabbit/vowpalwabbit@${version}"
          node -e "require('@vowpalwabbit/vowpalwabbit'); console.log('published package loads OK')"
